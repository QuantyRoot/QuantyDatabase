[workspace]
members = [
    "crates/quanty-core",
    "crates/quanty-auth",
    "crates/quanty-ql",
    "crates/quanty-exec",
    "crates/quanty-proto",
    "crates/quanty-server",
    "crates/quanty-service",
    "crates/quanty-sqlite",
    "crates/quanty-import",
    "crates/quanty-cli",
    "crates/quanty-bench",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/QuantyRoot/QuantyDatabase"

[profile.release]
lto = "thin"
codegen-units = 1
