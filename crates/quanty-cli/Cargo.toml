[package]
name = "quanty-cli"
description = "The quanty command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quanty"
path = "src/main.rs"

[dependencies]
quanty-core.workspace = true
quanty-exec.workspace = true
quanty-import.workspace = true
quanty-ql.workspace = true
quanty-sqlite.workspace = true
# Minting a token and speaking the wire protocol are portable. Only the
# server needs epoll, so only the server is behind a target.
quanty-auth.workspace = true
quanty-proto.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
quanty-service.workspace = true
quanty-server.workspace = true
# The tool owns the process, so the tool is what turns a signal into a
# shutdown. That is a syscall, and every syscall in this workspace is in
# quanty-sys.
quanty-sys.workspace = true
