[package]
name = "quanty-cli"
description = "The quanty command line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quanty"
path = "src/main.rs"

[dependencies]
quanty-core = { path = "../quanty-core" }
quanty-exec = { path = "../quanty-exec" }
quanty-import = { path = "../quanty-import" }
quanty-ql = { path = "../quanty-ql" }
quanty-sqlite = { path = "../quanty-sqlite" }
# Minting a token and speaking the wire protocol are portable. Only the
# server needs epoll, so only the server is behind a target.
quanty-auth = { path = "../quanty-auth" }
quanty-proto = { path = "../quanty-proto" }

[target.'cfg(target_os = "linux")'.dependencies]
quanty-service = { path = "../quanty-service" }
quanty-server = { path = "../quanty-server" }
