[package]
name = "quanty-bench"
description = "Times QuantyDB against SQLite on the same machine, through both engines' own command line tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quanty-bench"
path = "src/main.rs"

[[bin]]
name = "quanty-acceptance"
path = "src/bin/acceptance.rs"

[dependencies]
quanty-proto = { path = "../quanty-proto" }
