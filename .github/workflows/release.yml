name: release

# CI runs on pushes to main and on pull requests, and not on tags. A tag
# therefore arrives here untested, so every build job runs the same tests
# the portable CI job runs before it builds anything. What you download was
# tested on the machine it was built on.
#
# `workflow_dispatch` does everything except publish, so this file can be
# exercised without spending a version number on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc, and the oldest runner GitHub still offers, because a
          # binary linked against a newer glibc refuses to start on an
          # older one and says almost nothing about why.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: quantydb-linux-x86_64
          # Static, for anything older than that runner. It costs about
          # 2.2x on the read path, measured, which is why it is the second
          # file and not the first. See ADR-040.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            name: quantydb-linux-x86_64-static
          - os: macos-latest
            target: aarch64-apple-darwin
            name: quantydb-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: quantydb-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: quantydb-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # A tag that does not match the version in the workspace produces a
      # release whose binaries report a different number than its name.
      - name: the tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version"
            exit 1
          fi
          echo "v$tag matches the workspace"

      - name: tests
        run: cargo test --workspace --locked

      - name: build
        run: cargo build --release --locked -p quantydb-cli --target ${{ matrix.target }}

      # Named for the platform rather than the target triple, and carrying
      # its own checksum, so a downloaded file can be checked without
      # fetching a second one.
      - name: name it and check it
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/quantydb.exe" "dist/${{ matrix.name }}.exe"
            cd dist && sha256sum "${{ matrix.name }}.exe" > "${{ matrix.name }}.exe.sha256"
          else
            cp "target/${{ matrix.target }}/release/quantydb" "dist/${{ matrix.name }}"
            cd dist
            if command -v sha256sum > /dev/null; then
              sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
            else
              shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
            fi
          fi
          ls -l

      - name: it runs and says who it is
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./dist/${{ matrix.name }}.exe about
          elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            echo "cross built on arm64, not run here"
          else
            ./dist/${{ matrix.name }} about
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: one checksum file for all of them
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -l

      - name: the version, without the v
        id: version
        run: echo "n=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: tools for the package formats
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils createrepo-c rpm

      # Imported into the runner's keyring, which is thrown away with the
      # runner. Without the secret the scripts still build the packages and
      # say they did not sign them, so a missing secret is a loud repository
      # rather than a silent one.
      - name: the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not set, packages will be unsigned"
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: build the deb and the rpm
        run: |
          chmod +x packaging/*.sh
          mkdir -p debs
          packaging/deb.sh dist/quantydb-linux-x86_64 "${{ steps.version.outputs.n }}" amd64 debs
          packaging/apt-repo.sh debs site/apt
          packaging/rpm-repo.sh dist/quantydb-linux-x86_64 "${{ steps.version.outputs.n }}" x86_64 site/rpm
          cp debs/*.deb site/rpm/*.rpm dist/

      # The formula points at files that only exist once this release does,
      # so its checksums come out of the SHA256SUMS just written rather than
      # from anybody's memory.
      - name: point the formula at this release
        run: |
          v="${{ steps.version.outputs.n }}"
          sum() { grep "  $1\$" dist/SHA256SUMS | cut -d' ' -f1; }
          python3 - "$v" "$(sum quantydb-macos-arm64)" \
                       "$(sum quantydb-macos-x86_64)" \
                       "$(sum quantydb-linux-x86_64)" <<'EOF'
          import re, sys
          version, arm, intel, linux = sys.argv[1:5]
          p = "Formula/quantydb.rb"
          s = open(p).read()
          s = re.sub(r'version "[^"]*"', f'version "{version}"', s, count=1)
          for want in (arm, intel, linux):
              s = s.replace('"' + "0" * 64 + '"', f'"{want}"', 1)
          open(p, "w").write(s)
          print(s)
          EOF

      - name: publish the site and the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Elchi"
          git config user.email "github@elchi.dev"
          git add Formula/quantydb.rb
          git commit -m "release: formula points at ${{ steps.version.outputs.n }}"
          git push origin HEAD:main

          # gh-pages keeps only what a package manager fetches, so it is
          # rebuilt rather than merged: an old .deb left behind is an old
          # .deb apt will happily install.
          git fetch origin gh-pages
          git worktree add /tmp/pages gh-pages
          rm -rf /tmp/pages/apt /tmp/pages/rpm
          cp -r site/apt site/rpm /tmp/pages/
          cp install.sh /tmp/pages/install.sh
          cd /tmp/pages
          git add -A
          git commit -m "release: packages for ${{ steps.version.outputs.n }}"
          git push origin gh-pages
          cd -

      # gh is on the runner already. A release is rare enough that another
      # action is a dependency bought for five minutes a month.
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "See CHANGELOG.md for what changed, and docs/INSTALL.md for how to install this. The server runs on Linux; the macOS and Windows binaries build and test there but have not carried a soak (ADR-038)." \
            dist/*
