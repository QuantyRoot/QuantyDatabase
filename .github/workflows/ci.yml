name: CI

on:
  push:
    branches: [main]
  pull_request:

# The toolchain is pinned, not tracked.
#
# `-D warnings` turns every lint into a build failure, so following stable
# means every Rust release can break a commit that has nothing to do with
# it. That is exactly how 1.98 broke this file: it added
# `for_unbounded_range`, and a test loop that had been correct for weeks
# stopped compiling on an unrelated push.
#
# Raising this is a deliberate act with its own commit, which is where the
# new lints get read and dealt with. The MSRV job below is pinned for a
# different reason: it is the promise, not the ceiling.
env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  crash-harness:
    name: crash harness (1000 kills)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: kill -9 the pager a thousand times
        run: cargo test -p quanty-core --test crash_harness -- --nocapture
        env:
          QUANTY_CRASH_ITERS: "1000"

  txn-crash-harness:
    name: txn crash harness (1000 kills)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: kill -9 inside an open transaction a thousand times
        run: cargo test -p quanty-exec --test txn_crash -- --nocapture
        env:
          QUANTY_TXN_CRASH_ITERS: "1000"

  msrv:
    name: test on MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # --locked: the committed lock file is exactly what this job
      # certifies, rather than whatever resolution picks on the day.
      - run: cargo test --workspace --locked

  heavy:
    name: heavy tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: 1M key bulk load and scan
        run: cargo test -p quanty-core --release --test heavy -- --ignored --nocapture

  parser-fuzz:
    name: parser fuzz (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: fuzz the QQL parser
        run: cargo test -p quanty-ql --release --test parser_fuzz -- --nocapture
        env:
          QUANTY_FUZZ_SECS: "600"

  sql-parser-fuzz:
    name: sql parser fuzz (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: fuzz the SQL parser
        run: cargo test -p quanty-ql --release --test sql_parser_fuzz -- --nocapture
        env:
          QUANTY_FUZZ_SECS: "600"

  sqlite-reader-fuzz:
    name: sqlite reader fuzz (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: fuzz the SQLite reader
        run: cargo test -p quanty-sqlite --release --test reader_fuzz -- --nocapture
        env:
          QUANTY_FUZZ_SECS: "600"

  server-crash:
    name: server crash harness (300 kills)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: kill -9 the server mid-write and check what it promised
        run: cargo test -p quanty-cli --release --test crash -- --nocapture
        env:
          QUANTY_SERVER_CRASH_ITERS: "300"

  server-soak:
    name: server soak (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: hammer the executor from many connections
        run: cargo test -p quanty-service --release --test soak -- --nocapture
        env:
          QUANTY_FUZZ_SECS: "600"

  proto-fuzz:
    name: protocol fuzz (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: fuzz the wire protocol
        run: cargo test -p quanty-proto --release --test proto_fuzz -- --nocapture
        env:
          QUANTY_FUZZ_SECS: "600"

  benchmarks:
    name: benchmarks against sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: time both engines on the same machine
        run: |
          cargo build --release -p quanty-cli -p quanty-bench
          ./target/release/quanty-bench --check | tee bench.txt
      - name: put the table in the job summary
        if: always()
        run: |
          echo '## Benchmarks against SQLite' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
